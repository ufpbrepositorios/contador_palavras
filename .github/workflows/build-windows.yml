name: Build Windows Binary

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain and Windows target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Build release binary for Windows
        run: cargo build --locked --release --target x86_64-pc-windows-gnu

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: contador_palavras-windows-x86_64
          path: target/x86_64-pc-windows-gnu/release/wordcounter.exe